spring.application.name=smartspend-backend

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/smartspend_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.port=${PORT:8080}